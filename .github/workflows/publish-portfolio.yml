name: Publish firewall-safe portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install PDF link updater
        run: python3 -m pip install --quiet pypdf

      - name: Create independent static copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"

          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --domains ramalakshmi-portfolio.ramalakshmi-dwadasi.chatgpt.site \
            --execute robots=off \
            --quiet \
            https://ramalakshmi-portfolio.ramalakshmi-dwadasi.chatgpt.site/

          source_dir="$temp_dir/ramalakshmi-portfolio.ramalakshmi-dwadasi.chatgpt.site"
          cp -a "$source_dir/." "$GITHUB_WORKSPACE/_site/"
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY'
          from pathlib import Path
          import re

          site = Path("_site")
          pages = list(site.rglob("*.html"))

          for page in pages:
              html = page.read_text(encoding="utf-8")
              html = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  "",
                  html,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              page.write_text(html, encoding="utf-8")

          required = [
              "index.html",
              "work.html",
              "about.html",
              "art.html",
              "experience.html",
              "contact-resume.html",
              "resume.html",
              "work/pharos.html",
              "work/call-agent-application.html",
              "work/online-registration.html",
              "ramalakshmi-watercolor-feathered.png",
              "ramalakshmi-dwadasi-cv.pdf",
          ]

          missing = [path for path in required if not (site / path).is_file()]
          if missing:
              raise SystemExit(f"Static copy is incomplete: {missing}")

          # Keep the résumé's portfolio hyperlink aligned with this public site.
          from pypdf import PdfReader, PdfWriter
          from pypdf.generic import TextStringObject

          resume = site / "ramalakshmi-dwadasi-cv.pdf"
          reader = PdfReader(resume)
          writer = PdfWriter()
          writer.clone_document_from_reader(reader)

          old_url = "https://ramalakshmi-portfolio.ramalakshmi-dwadasi.chatgpt.site"
          new_url = "https://ramalakshmidwadasi.github.io/"

          for page in writer.pages:
              for annotation_ref in page.get("/Annots", []) or []:
                  annotation = annotation_ref.get_object()
                  action = annotation.get("/A")
                  if action and str(action.get("/URI", "")) == old_url:
                      action.update({"/URI": TextStringObject(new_url)})

          corrected_resume = site / "ramalakshmi-dwadasi-cv-updated.pdf"
          with corrected_resume.open("wb") as output:
              writer.write(output)
          corrected_resume.replace(resume)

          (site / ".nojekyll").touch()
          (site / "404.html").write_text(
              (site / "index.html").read_text(encoding="utf-8"),
              encoding="utf-8",
          )

          print(f"Prepared {len(pages)} pages and {sum(1 for p in site.rglob('*') if p.is_file())} files")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
